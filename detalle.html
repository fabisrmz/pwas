<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Detalle del café</title>

    <link rel="stylesheet" href="css/detalle.css">

</head>


<body>

    <main>

        <nav>

            <h1>Coffee PWA</h1>

            <a href="index.html">← Regresar</a>

        </nav>


        <section class="detalle-container">

            <img id="imagen-cafe" src="" alt="Café">


            <div class="informacion">

                <h2 id="nombre-cafe"></h2>

                <p id="descripcion-cafe"></p>


                <div class="datos">

                    <p>
                        <strong>Precio:</strong>
                        <span id="precio-cafe"></span>
                    </p>

                    <p>
                        <strong>Tamaño:</strong>
                        <span id="tamano-cafe"></span>
                    </p>

                    <p>
                        <strong>Ingredientes:</strong>
                        <span id="ingredientes-cafe"></span>
                    </p>

                </div>


                <h3>Recomendación</h3>

                <p id="recomendacion-cafe"></p>


                <button onclick="window.location.href='index.html'">
                    Ver otros cafés
                </button>

            </div>

        </section>

    </main>


    <script src="js/detalle.js"></script>

</body>

</html>
